events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 의도적 취약점 1: 보안 헤더 누락 (OWASP A05:2021 - Security Misconfiguration)
    # 누락된 헤더:
    # - X-Frame-Options (Clickjacking 공격 가능)
    # - X-Content-Type-Options (MIME 스니핑 공격 가능)
    # - X-XSS-Protection (XSS 필터 비활성화)
    # - Content-Security-Policy (XSS, 데이터 주입 공격 가능)
    # - Strict-Transport-Security (HTTPS 강제 없음)

    # 의도적 취약점 2: 서버 정보 노출
    server_tokens on;

    # Logging
    access_log /var/log/nginx/access.log;
    # 의도적 취약점 3: 에러 로그에 민감한 정보 포함 가능
    error_log /var/log/nginx/error.log debug;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # 의도적 취약점 4: 디렉토리 리스팅 허용
        autoindex on;

        # 의도적 취약점 5: 클라이언트 요청 크기 제한 없음 (DoS 공격 가능)
        client_max_body_size 100M;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            # 의도적 취약점 6: X-Real-IP 헤더 검증 없음 (IP 스푸핑 가능)
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 의도적 취약점 7: Rate Limiting 없음 (무차별 대입 공격 가능)
        }

        # API Documentation (의도적 취약점 8: 운영 환경에서 Swagger 노출)
        location /docs {
            proxy_pass http://backend/docs;
        }

        location /openapi.json {
            proxy_pass http://backend/openapi.json;
        }

        # Uploads
        location /uploads/ {
            proxy_pass http://backend/uploads/;
            # 의도적 취약점 9: 업로드 파일 직접 실행 가능 (파일 업로드 취약점)
        }

        # 의도적 취약점 10: 민감한 파일 접근 가능 (정보 노출)
        location /.env {
            proxy_pass http://backend/.env;
        }

        location /config/ {
            proxy_pass http://backend/app/config.py;
        }

        # 의도적 취약점 11: 관리자 경로 숨기지 않음
        location /admin/ {
            proxy_pass http://frontend/admin/;
        }

        # 의도적 취약점 12: 에러 페이지에서 상세 정보 노출
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }

    # 의도적 취약점 13: HTTP만 사용 (HTTPS 미설정)
    # 의도적 취약점 14: 기본 Nginx 설정 사용 (보안 강화 없음)
}

