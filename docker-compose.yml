version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kirby-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-KirbyShop2025!SecurePassword}
      MYSQL_DATABASE: kirby_shop
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    # MySQL 외부 노출 제거 (보안 강화)
    # ports:
    #   - "3306:3306"
    networks:
      - kirby-network
    command:
      # 로컬 접근만 허용
      - --bind-address=127.0.0.1
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kirby-backend
    restart: always
    environment:
      # 데이터베이스 연결
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-KirbyShop2025!SecurePassword}@mysql:3306/kirby_shop
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-KirbyShop2025!SecurePassword}
      DB_NAME: kirby_shop
      
      # JWT 설정 (보안 강화)
      SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-me-in-production-$(openssl rand -hex 32)}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # CORS 설정 (특정 도메인만 허용)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://your-domain.com}
      
      # 디버그 모드 비활성화 (운영 환경)
      DEBUG: "false"
      
      # 파일 업로드
      MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: uploads
    volumes:
      - ./kirby-shop-backend/uploads:/app/uploads
      # 소스코드 마운트 제거 (보안 강화)
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kirby-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kirby-frontend
    restart: always
    environment:
      # API URL (환경변수로 설정 가능)
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - kirby-network
    # 소스코드 마운트 제거 (보안 강화)

  nginx:
    image: nginx:alpine
    container_name: kirby-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - kirby-network

volumes:
  mysql_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  kirby-network:
    driver: bridge

# 보안 강화 완료:
# ✅ MySQL 외부 노출 제거
# ✅ 강력한 비밀번호 사용 (환경변수)
# ✅ 소스코드 마운트 제거
# ✅ 디버그 모드 비활성화
# ✅ CORS 제한
# ✅ 토큰 만료 시간 단축 (30분)
# ✅ HTTPS 포트 추가 (443)

