<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 페이지</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .payment-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        
        .payment-header {
            margin-bottom: 30px;
        }
        
        .payment-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
        }
        
        .kakao-logo {
            background: #FFEB00;
            color: #3c1e1e;
        }
        
        .toss-logo {
            background: #0064FF;
        }
        
        .naver-logo {
            background: #03C75A;
        }
        
        .inicis-logo {
            background: #0066CC;
        }
        
        .payment-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        
        .payment-subtitle {
            color: #666;
            font-size: 16px;
        }
        
        .payment-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .info-row:last-child {
            margin-bottom: 0;
            font-weight: 700;
            font-size: 18px;
            color: #333;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }
        
        .payment-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        
        .btn-cancel {
            background: #f5f5f5;
            color: #666;
        }
        
        .btn-cancel:hover {
            background: #e0e0e0;
        }
        
        .loading {
            display: none;
            margin-top: 20px;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .success-message {
            display: none;
            color: #4CAF50;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="payment-header">
            <div id="payment-logo" class="payment-logo kakao-logo">K</div>
            <h1 class="payment-title" id="payment-title">카카오페이 결제</h1>
            <p class="payment-subtitle">안전하고 간편한 결제</p>
        </div>
        
        <div class="payment-info">
            <div class="info-row">
                <span>상품명</span>
                <span id="product-name">커비샵 주문</span>
            </div>
            <div class="info-row">
                <span>결제금액</span>
                <span id="payment-amount">1,000원</span>
            </div>
            <div class="info-row">
                <span>결제수단</span>
                <span id="payment-method">카카오페이</span>
            </div>
        </div>
        
        <div class="payment-buttons">
            <button class="btn btn-success" onclick="processPayment()">결제하기</button>
            <button class="btn btn-cancel" onclick="cancelPayment()">취소</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>결제 처리 중...</p>
        </div>
        
        <div class="success-message" id="success-message">
            결제가 완료되었습니다!
        </div>
    </div>

    <script>
        // URL 파라미터에서 정보 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('payment_id');
        const method = urlParams.get('method');
        const amount = urlParams.get('amount');
        
        // 결제 수단에 따른 UI 업데이트
        function updatePaymentUI() {
            const logo = document.getElementById('payment-logo');
            const title = document.getElementById('payment-title');
            const methodSpan = document.getElementById('payment-method');
            
            switch(method) {
                case 'kakao':
                    logo.className = 'payment-logo kakao-logo';
                    logo.textContent = 'K';
                    title.textContent = '카카오페이 결제';
                    methodSpan.textContent = '카카오페이';
                    break;
                case 'toss':
                    logo.className = 'payment-logo toss-logo';
                    logo.textContent = 'T';
                    title.textContent = '토스페이 결제';
                    methodSpan.textContent = '토스페이';
                    break;
                case 'naver':
                    logo.className = 'payment-logo naver-logo';
                    logo.textContent = 'N';
                    title.textContent = '네이버페이 결제';
                    methodSpan.textContent = '네이버페이';
                    break;
                case 'inicis':
                    logo.className = 'payment-logo inicis-logo';
                    logo.textContent = 'I';
                    title.textContent = '이니시스 결제';
                    methodSpan.textContent = '이니시스';
                    break;
            }
        }
        
        // 결제 처리
        async function processPayment() {
            document.getElementById('loading').style.display = 'block';
            document.querySelector('.payment-buttons').style.display = 'none';
            
            try {
                // 실제 결제 승인 API 호출
                const response = await fetch('http://localhost:8000/api/payments/approve', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        payment_method: method,
                        payment_id: paymentId,
                        transaction_id: urlParams.get('tid') || urlParams.get('paymentKey') || `TXN_${paymentId}_${Date.now()}`,
                        payment_key: urlParams.get('paymentKey') || `KEY_${paymentId}_${Date.now()}`,
                        amount: parseInt(amount),
                        status: 'completed'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 결제 성공
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('success-message').style.display = 'block';
                        
                        // 부모 창에 결제 완료 알림
                        if (window.opener) {
                            window.opener.postMessage({
                                type: 'payment_completed',
                                payment_id: paymentId,
                                method: method,
                                amount: amount,
                                transaction_id: result.payment_id,
                                success: true
                            }, '*');
                        }
                        
                        // 3초 후 창 닫기
                        setTimeout(() => {
                            window.close();
                        }, 3000);
                    }, 1500); // 실제 결제 처리 시간 시뮬레이션
                } else {
                    throw new Error(result.message || '결제 처리에 실패했습니다.');
                }
            } catch (error) {
                console.error('결제 오류:', error);
                document.getElementById('loading').style.display = 'none';
                alert('결제 처리 중 오류가 발생했습니다: ' + error.message);
                
                // 부모 창에 결제 실패 알림
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'payment_failed',
                        payment_id: paymentId,
                        error: error.message,
                        success: false
                    }, '*');
                }
                
                // 실패 시에도 창 닫기
                setTimeout(() => {
                    window.close();
                }, 2000);
            }
        }
        
        // 결제 취소
        function cancelPayment() {
            if (window.opener) {
                window.opener.postMessage({
                    type: 'payment_cancelled',
                    payment_id: paymentId
                }, '*');
            }
            window.close();
        }
        
        // 페이지 로드 시 UI 업데이트
        document.addEventListener('DOMContentLoaded', function() {
            updatePaymentUI();
            document.getElementById('payment-amount').textContent = 
                parseInt(amount || '1000').toLocaleString() + '원';
        });
    </script>
</body>
</html>
